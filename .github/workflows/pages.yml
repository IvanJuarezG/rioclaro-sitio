name: Publish static site to GitHub Pages


on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: github-pages
  cancel-in-progress: true


jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site
        run: |
          mkdir _site
          unzip -q rioclaro-github-pages-fixed.zip -d _site
          rm -rf _site/.github
          rm -f _site/README-publicacion.md
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
